[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "music-ai-toolshop"
version = "0.4.0"
description = "CLI toolshop to orchestrate Suno, BPM/key analysis, YouTube scraping/summarization, track reverse engineering, and stem separation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
audio = ["librosa>=0.10", "numpy>=1.20", "scipy>=1.10"]
youtube = ["yt-dlp>=2023.0"]
voice = ["librosa>=0.10", "numpy>=1.20", "scipy>=1.10", "praat-parselmouth>=0.4", "soundfile>=0.12"]
voice-full = ["librosa>=0.10", "numpy>=1.20", "scipy>=1.10", "praat-parselmouth>=0.4", "soundfile>=0.12", "crepe>=0.0.16", "tensorflow>=2.10"]
cleaning = ["librosa>=0.10", "numpy>=1.20", "scipy>=1.10", "soundfile>=0.12", "pyyaml>=6.0"]
stems = ["audio-separator>=0.44", "onnxruntime>=1.17", "soundfile>=0.12", "demucs>=4.0"]
track = ["librosa>=0.10", "numpy>=1.20", "scipy>=1.10", "yt-dlp>=2023.0", "matplotlib>=3.5", "soundfile>=0.12", "pydub>=0.25", "pyloudnorm>=0.1", "pyyaml>=6.0"]
track-full = ["librosa>=0.10", "numpy>=1.20", "scipy>=1.10", "yt-dlp>=2023.0", "matplotlib>=3.5", "soundfile>=0.12", "pydub>=0.25", "pyloudnorm>=0.1", "pyyaml>=6.0", "torch>=1.12", "torchcrepe>=0.0.22", "demucs>=4.0", "panns-inference>=0.1.0", "spleeter>=2.1.0; python_version<'3.12'", "madmom>=0.16.1; python_version<'3.12'", "basic-pitch", "essentia; platform_system!='Windows'", "fastapi>=0.109.0", "uvicorn[standard]>=0.22.0"]
all = ["librosa>=0.10", "numpy>=1.20", "scipy>=1.10", "yt-dlp>=2023.0", "praat-parselmouth>=0.4", "soundfile>=0.12", "pyyaml>=6.0", "matplotlib>=3.5", "pydub>=0.25", "pyloudnorm>=0.1", "pedalboard>=0.9"]
lyrics = ["requests>=2.28", "beautifulsoup4>=4.12", "python-dotenv>=1.0", "langdetect>=1.0", "lyricsgenius>=3.0", "cyrtranslit>=1.2", "phonemizer>=3.0", "datasette>=0.64"]
remix = ["pedalboard>=0.9", "librosa>=0.10", "numpy>=1.20", "scipy>=1.10", "soundfile>=0.12"]
video = ["librosa>=0.10", "numpy>=1.20", "Pillow>=10.0", "moderngl>=5.8", "httpx>=0.25"]
melody = ["pretty_midi>=0.2.10", "mido>=1.3", "numpy>=1.20", "scipy>=1.10", "librosa>=0.10", "soundfile>=0.12", "basic-pitch"]
lyrics-nlp = ["classla", "bertopic", "sentence-transformers", "umap-learn", "hdbscan", "torch"]
lyrics-craft = ["scikit-learn>=1.3", "streamlit>=1.30", "plotly>=5.18"]
# NOTE — protobuf must be >= 5.x. Keep it at 7.36.0.
#
# The declared constraints are UNSATISFIABLE: classla wants ==4.21.2, onnxruntime
# wants >=4.25.8, onnx-weekly wants >=6.31.1. One is always violated. classla's
# is the one to violate: it imports and its 20 tests pass at 7.36.0.
#
# MEASURED 2026-08-31 — pinning DOWN to 4.21.2 BREAKS STEM SEPARATION:
#   audio_separator.separator.architectures.mdx_separator imports `onnx`, and
#   onnx needs google.protobuf.runtime_version, which does not exist before 5.x.
#   ImportError, so `load_model` never runs and the vocal-swap lane dies at its
#   first stage.
#
# An earlier check called 4.21.2 "all green" because it tested `onnxruntime`
# (a different package) and a bare `import audio_separator` (a different module).
# Neither touches the failing path. `toolshop vocal-swap doctor` now imports
# mdx_separator itself so this cannot pass unnoticed again.
#
# Separately: `torchvision` is REQUIRED (onnx2torch imports it eagerly) and was
# missing from this venv entirely. Install the build matching torch:
#   pip install --no-deps torchvision==0.21.0     # pairs with torch 2.6.0
lyrics-asr = ["faster-whisper>=1.0", "ctranslate2>=4.0"]
swap = ["librosa>=0.10", "numpy>=1.20", "scipy>=1.10", "soundfile>=0.12", "pyloudnorm>=0.1", "audio-separator>=0.44", "onnxruntime>=1.17"]

[tool.setuptools.packages.find]
include = ["toolshop*"]

[project.scripts]
toolshop = "toolshop.cli:main"
