# musubi-tuner dataset config for Wan 2.2 I2V video LoRA training
# Generated by train_wan_lora.py — edit manually for custom configurations
#
# Dataset: video clips (2-5s each, MP4 H.264) + text captions (.txt)
# Resolution: 480x720 (training) — native 1280x720 for final quality
# Frames per sample: 12 (compromise between motion learning and VRAM)

[general]
resolution = [480, 720]
frame_bucket = 12
shuffle_caption = true
keep_tokens = 1

[[datasets]]
batch_size = 1
enable_bucket = false

  [[datasets.subsets]]
  # Update this path to your video clips directory on RunPod
  image_dir = "/workspace/dataset/video_clips"
  caption_extension = ".txt"
  num_repeats = 10
